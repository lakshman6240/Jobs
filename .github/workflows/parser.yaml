name: Job Notification

# Trigger the workflow on any push event to the repository
on: 
  workflow_dispatch: 

jobs:

  create-matrix:
    runs-on: ubuntu-latest

    outputs:
      chunks: ${{ steps.matrix.outputs.chunks }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Matrix
        id: matrix
        run: |
          python - <<'PY'
          import json
          import math

          CHUNK_SIZE = 10

          with open("parsers/data.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          total_documents = len(data)

          number_of_chunks = math.ceil(total_documents / CHUNK_SIZE)

          chunks = list(range(number_of_chunks))

          print("========================================")
          print(f"Total documents : {total_documents}")
          print(f"Chunk size      : {CHUNK_SIZE}")
          print(f"Number of jobs  : {number_of_chunks}")
          print(f"Chunks          : {chunks}")
          print("========================================")

          with open("matrix.json", "w", encoding="utf-8") as f:
              json.dump(chunks, f)

          PY

          echo "chunks=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  careers:
    needs: create-matrix

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        chunk: ${{ fromJSON(needs.create-matrix.outputs.chunks) }}

    steps:

      # -------------------------------------------------------
      # Checkout repository
      # -------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # -------------------------------------------------------
      # Setup Python
      # -------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      # -------------------------------------------------------
      # Install dependencies
      # -------------------------------------------------------
      - name: Installing requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r parsers/requirements.txt

          playwright install
          playwright install-deps


      # -------------------------------------------------------
      # Show current chunk
      # -------------------------------------------------------
      - name: Show Chunk Information
        run: |
          echo "========================================"
          echo "Chunk ID: ${{ matrix.chunk }}"
          echo "========================================"


      # -------------------------------------------------------
      # Run careers scraper
      # -------------------------------------------------------
      - name: Running Careers
        run: |
          CHUNK_ID=${{ matrix.chunk }}

          START=$((CHUNK_ID * 20))
          END=$((START + 20))

          echo "========================================"
          echo "Chunk ID : $CHUNK_ID"
          echo "Start   : $START"
          echo "End     : $END"
          echo "========================================"



